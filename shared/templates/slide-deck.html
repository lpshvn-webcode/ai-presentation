<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Название презентации</title>
  <link rel="stylesheet" href="../../shared/css/print.css" />
  <style>
    /* стили конкретной презентации — поверх shared/css/print.css */
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }

    .slide {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 64px;
    }

    .slide h1 {
      font-size: 48px;
      margin: 0 0 16px;
    }

    .slide p {
      font-size: 24px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <section class="slide">
    <h1>Заголовок слайда 1</h1>
    <p>Текст слайда</p>
  </section>

  <section class="slide">
    <h1>Заголовок слайда 2</h1>
    <p>Текст слайда</p>
  </section>

  <!-- добавляй .slide секции по необходимости -->

</body>
</html>
