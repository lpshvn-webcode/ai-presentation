<!--
  БЛОК: case-metrics — один кейс/проект целиком на слайд: название +
  ниша, 4 мини-показателя в ряд, и блок «Что сделали» с конкретным
  решением, закрытый строкой с квантифицированным результатом внизу.
  Когда использовать: портфолио кейсов, где на каждый проект — один
  слайд с цифрами и «закрытой кухней» (а не общими фразами).
  Что менять:
  - top-meta: "Кейс N из M · категория"
  - kicker: иконка + короткое позиционирование ниши
  - headline: название проекта
  - lede: одна строка — чем занимается + с какого периода работаем
  - 4 карточки cols-4: подписи и значения — если метрика текстовая,
    а не числовая (например "CAPI на квал"), уменьши font-size у
    .stat-big до ~22px, чтобы слово поместилось в карточку
  - .callout "Что сделали" — конкретное решение, не общая фраза
    («протестировали X», «перенастроили Y»), с конкретными деталями
  - bottom-row — главный количественный результат этого решения
    (обычно с процентом до/после), выделяй само число <b class="accent">
-->
<section class="slide">
  <div class="top-row"><div class="top-meta">Кейс N из M · Категория</div></div>
  <div class="body-area">
    <div style="margin-bottom:20px;">
      <div class="kicker">
        <svg class="i" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5v9M9 9.8c0-1.3 1.3-2.3 3-2.3s3 .9 3 2c0 2.6-6 1.4-6 4 0 1.1 1.3 2 3 2s3-.9 3-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Ниша проекта
      </div>
      <h1 class="headline">Название проекта</h1>
      <p class="lede" style="font-size:15px;">Чем занимается проект · работаем с [месяц год]</p>
    </div>
    <div class="cols cols-4" style="gap:18px; margin-bottom:22px;">
      <div class="card"><div class="stat-label">Бюджет</div><div class="stat-big" style="font-size:26px; margin-top:4px;">$0</div></div>
      <div class="card"><div class="stat-label">Цена за лид</div><div class="stat-big" style="font-size:26px; margin-top:4px;">$0</div></div>
      <div class="card"><div class="stat-label">Квал. заявок</div><div class="stat-big accent" style="font-size:26px; margin-top:4px;">0%</div></div>
      <div class="card"><div class="stat-label">ROMI</div><div class="stat-big accent" style="font-size:26px; margin-top:4px;">0%</div></div>
    </div>
    <div class="callout">
      <div class="step-num">Что сделали</div>
      <div class="item-desc" style="max-width:100%;">Конкретное решение, которое приняли именно для этого проекта, и почему.</div>
    </div>
  </div>
  <div class="bottom-row">
    <span>Главный измеримый результат: <b class="accent">−N%</b> к цене, <b class="accent">+N%</b> к качеству</span>
    <span class="slide-no"><b class="num">NN</b> / N</span>
  </div>
</section>
